[project]
name = "fundscope"
version = "0.1.0"
description = "RAG assistant over ETF factsheets and KIDs, with a tool-calling LLM agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "chromadb>=1.5.9",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "yfinance>=1.7.0",
]

[project.scripts]
fundscope          = "fundscope.agent:main"
fundscope-setup    = "fundscope.bootstrap:main"
fundscope-pipeline = "fundscope.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundscope"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evaluation"]   # evaluate.py / judge.py are scripts, not package modules

[tool.ruff]
line-length = 120
src = ["src", "evaluation", "tests"]

[tool.ruff.lint]
# pyflakes + import/syntax errors; the code base aligns assignments with spaces
# and puts short ifs on one line, so the pycodestyle style rules stay off.
select = ["F", "E9", "E711", "E712", "E713", "E714", "B006", "B904"]
